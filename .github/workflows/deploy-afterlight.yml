name: Deploy AFTERLIGHT to Vercel

on:
  push:
    branches:
      - afterlight-jev-deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Prepare AFTERLIGHT project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/.vercel
          curl -fLsS https://afterlightjevgame.vercel.app/ -o deploy/index.html
          cp afterlight-deploy/game.js deploy/game.js
          cp afterlight-deploy/director.js deploy/director.js
          cp afterlight-deploy/director.mjs deploy/director.mjs
          cp -R afterlight-deploy/api deploy/api
          cp afterlight-deploy/package.json deploy/package.json
          cp afterlight-deploy/vercel.json deploy/vercel.json
          printf '%s\n' '{"projectId":"prj_ggHpzDOAvkgkExhxZagJvvML8wFm","orgId":"team_tuvwyR6RVI33ZZMqWySySD16"}' > deploy/.vercel/project.json
          node --check deploy/game.js
          node --check deploy/director.js
          node --check deploy/director.mjs
          node --check deploy/api/director.js
          node --check deploy/api/health.js

      - name: Install Vercel CLI
        run: npm install -g vercel@latest --no-audit --no-fund

      - name: Detect existing Vercel token
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy with repository Vercel token
        if: steps.token.outputs.present == 'true'
        working-directory: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --scope gaming-ch --token "$VERCEL_TOKEN"

      - name: Login and deploy with Vercel Device Flow
        if: steps.token.outputs.present != 'true'
        working-directory: deploy
        shell: bash
        run: |
          echo "::notice::Starting Vercel CLI login."
          CI=0 NO_COLOR=1 script -q -e -c "vercel login" /dev/null
          vercel deploy --prod --yes --scope gaming-ch

      - name: Verify health endpoint
        shell: bash
        run: |
          sleep 3
          curl -fsS https://afterlightjevgame.vercel.app/api/health
          echo
