name: Deploy AFTERLIGHT to Vercel

on:
  push:
    branches:
      - afterlight-jev-deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AFTERLIGHT project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/api deploy/.vercel

          curl -fLsS https://afterlightjevgame.vercel.app/ -o deploy/index.html
          curl -fLsS https://afterlightjevgame.vercel.app/game.js -o deploy/game.js
          curl -fLsS https://afterlightjevgame.vercel.app/director.js -o deploy/director.js

          echo ' ' | base64 -d > deploy/director.mjs

          echo '' | base64 -d > deploy/api/director.js

          echo '' | base64 -d > deploy/api/health.js

          echo 'ewogICJuYW1lIjogImFmdGVybGlnaHQtamV2LXZlcmNlbCIsCiAgInByaXZhdGUiOiB0cnVlLAogICJ2ZXJzaW9uIjogIjEuMS4wIiwKICAidHlwZSI6ICJtb2R1bGUiLAogICJlbmdpbmVzIjogeyAibm9kZSI6ICI+PTIyIiB9Cn0K' | base64 -d > deploy/package.json
          echo '' | base64 -d > deploy/vercel.json
          printf '%s\n' '{"projectId":"prj_ggHpzDOAvkgkExhxZagJvvML8wFm","orgId":"team_tuvwyR6RVI33ZZMqWySySD16"}' > deploy/.vercel/project.json

          test -s deploy/index.html
          test -s deploy/game.js
          test -s deploy/director.js
          test -s deploy/api/director.js
          test -s deploy/api/health.js

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Detect existing Vercel token
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with repository Vercel token
        if: steps.token.outputs.present == 'true'
        working-directory: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel project inspect --non-interactive --scope gaming-ch
          vercel deploy --prod --yes --scope gaming-ch

      - name: Login and deploy with Vercel Device Flow
        if: steps.token.outputs.present != 'true'
        working-directory: deploy
        shell: bash
        run: |
          echo "::notice::No VERCEL_TOKEN repository secret found. Starting Vercel OAuth Device Flow."
          CI= script -q -e -c "vercel login" /dev/null
          vercel project inspect --non-interactive --scope gaming-ch
          vercel deploy --prod --yes --scope gaming-ch
